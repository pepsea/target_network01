# target_net configuration -- copy to ./target_net.yaml (or ~/.target_net.yaml) and edit the paths.
# Any path left null is downloaded on demand into cache_dir (if allow_download is true).

cache_dir: ~/Documents/database/target_net_cache
allow_download: true          # false = offline: every database must have a local path

databases:
  signor:                     # SIGNOR all_data_DD_MM_YY.tsv or API dump, CC-BY 4.0
    path: ~/Documents/database/signor/all_data_12_07_26.tsv
    indirect: drop            # drop (default) | weight | keep  -- SIGNOR relations with DIRECT=NO are pathway-level shortcuts
  reactome_fi:                # Reactome FI network with annotations (.txt or .zip), CC0
    path: ~/Documents/database/reactome/FIsInGene_061424_with_annotations.txt
    mode: context             # context (default) | directed | off  -- FIs collapse whole pathways into one edge; walk on SIGNOR only
    min_score: 1.0            # keep FI score >= this (1.0 = pathway-annotated only; predicted FIs are always dropped)
    weight: 0.5               # walk weight of Reactome-only directed edges (SIGNOR 0.9) -> curated SIGNOR routes win
  tf_list:                    # Lambert 2018 human TFs (DatabaseExtract_v_1.01.csv), CC-BY
    path: ~/Documents/database/tf/DatabaseExtract_v_1.01.csv
  uniprot:                    # bulk human reviewed UniProt tsv (fields: accession, gene_primary, keyword, cc_subcellular_location)
    path: ~/Documents/database/uniprot/uniprot_human_reviewed.tsv   # gives receptors + compartments offline; download once:
    # curl -o uniprot_human_reviewed.tsv "https://rest.uniprot.org/uniprotkb/stream?query=organism_id:9606+AND+reviewed:true&fields=accession,gene_primary,keyword,cc_subcellular_location&format=tsv"
  receptors:                  # optional override: plain text, one HGNC symbol per line
    path: null
  regulon:                    # DoRothEA / CollecTRI regulons
    source: dorothea          # dorothea | collectri
    conf: ABC                 # DoRothEA confidence levels to keep
    license: commercial       # OmniPath per-record licence filter: commercial | academic | ignore
    path: ~/Documents/database/dorothea/dorothea_ABC_commercial.tsv   # OmniPath export or tf,target,mor,confidence; null = download
    # download once:  python target_net.py regulon-url   (prints the URL)  ->  curl -o <path> "<url>"
  string:
    min_score: 700            # STRING physical network, experimental+database channels, via API
  compartments:               # tsv: gene <TAB> compartment (membrane|cytosol|lysosome|mitochondrion|ER_golgi|nucleus); null = UniProt API
    path: null
  depmap:                     # folder with CRISPRGeneEffect.csv, OmicsSomaticMutations.csv, OmicsExpression*ProteinCoding*.csv (either release name)
    dir: ~/Documents/database/depmap
  hpa_tissue:                 # HPA rna_tissue_consensus.tsv(.zip), CC BY-SA (filter only)
    path: ~/Documents/database/hpa/rna_tissue_consensus_tissues.tsv

walk:
  max_depth: 5
  min_score: 0.25           # live AKT1: 0.2 -> 903 nodes/79 receptors, 0.3 -> 222/13; 0.25 is the compromise
  hub_penalty: 0.25

crosstalk:                  # cross-talk mode walks are deliberately local (hubs like AKT1 reach most of the graph at depth 5)
  max_depth: 3
  min_score: 0.3
  min_sign_confidence: 0.5  # endpoints count as synergistic/antagonistic only when both signs are this confident
  max_edges_plot: 40        # interference edges drawn (ranked by proximity); all are in interference.csv

sl:
  min_lost: 20
  padj: 0.05
  delta: 0.15
