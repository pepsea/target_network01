# target_net configuration -- copy to ./target_net.yaml (or ~/.target_net.yaml) and edit the paths.
# Any path left null is downloaded on demand into cache_dir (if allow_download is true).

cache_dir: ~/data/target_net_cache
allow_download: true          # false = offline: every database must have a local path

databases:
  signor:                     # SIGNOR causal interactions dump (tsv), CC-BY 4.0
    path: ~/data/signor/signor_human.tsv
  reactome_fi:                # Reactome FI network with annotations (.txt or .zip), CC0
    path: ~/data/reactome/FIsInGene_070323_with_annotations.txt.zip
  tf_list:                    # Lambert 2018 human TFs (DatabaseExtract_v_1.01.csv), CC-BY
    path: ~/data/tf/DatabaseExtract_v_1.01.csv
  receptors:                  # plain text, one HGNC symbol per line; null = UniProt KW-0675 + cell membrane via API
    path: null
  regulon:                    # tsv/csv columns: tf, target, mor (+1/-1), confidence (A-E)
    source: dorothea          # dorothea | collectri (used for the OmniPath download when path is null)
    conf: ABC
    path: ~/data/dorothea/dorothea_hs_ABC.tsv
  string:
    min_score: 700            # STRING physical network, experimental+database channels, via API
  compartments:               # tsv: gene <TAB> compartment (membrane|cytosol|lysosome|mitochondrion|ER_golgi|nucleus); null = UniProt API
    path: null
  depmap:                     # folder with CRISPRGeneEffect.csv [, OmicsSomaticMutations.csv, OmicsExpressionProteinCodingGenesTPMLogp1.csv]
    dir: ~/data/depmap
  hpa_tissue:                 # HPA rna_tissue_consensus.tsv(.zip), CC BY-SA (filter only)
    path: ~/data/hpa/rna_tissue_consensus.tsv.zip

walk:
  max_depth: 6
  min_score: 0.15
  hub_penalty: 0.25

sl:
  min_lost: 20
  padj: 0.05
  delta: 0.15
