# target_net configuration
# Copy to ./target_net.yaml (project root; also found from notebooks/) or ~/.target_net.yaml and edit the paths.
# Every key below is read by the code; keys you leave out take these defaults. Check what will actually be used with:
#     python target_net.py check-config
#
# Expected folder layout (one root, here ~/Documents/database):
#   signor/all_data_12_07_26.tsv                         SIGNOR "download all data" (or signor_human.tsv API dump)
#   reactome/FIsInGene_061424_with_annotations.txt        Reactome Functional Interactions (.txt or .zip)
#   uniprot/uniprot_human_reviewed.tsv                    UniProt bulk tsv (accession, gene_primary, keyword, cc_subcellular_location)
#   tf/DatabaseExtract_v_1.01.csv                         Lambert 2018 human TF list
#   dorothea/dorothea_ABC_commercial.tsv                  DoRothEA regulons (OmniPath export)  <- python target_net.py regulon-url --save <path>
#   depmap/CRISPRGeneEffect.csv                           DepMap CRISPR gene effect (Chronos)          required for genetics
#   depmap/OmicsSomaticMutations.csv                      DepMap mutations (seed-lost lines)            needed for SL by mutation
#   depmap/OmicsExpressionTPMLogp1HumanProteinCodingGenes.csv  DepMap expression (SL fallback; older name OmicsExpressionProteinCodingGenesTPMLogp1.csv also accepted)
#   hpa/rna_tissue_consensus_tissues.tsv                  HPA tissue consensus (only for --tissue)
#   target_net_cache/                                     anything the tool downloads itself

cache_dir: ~/Documents/database/target_net_cache
allow_download: true            # true: a database without a local path is fetched into cache_dir; false: strictly offline (missing file = stop, STRING skipped)

databases:

  # ---- walk graph: signed, directed signaling edges (required) --------------------------------------------
  signor:
    path: ~/Documents/database/signor/all_data_12_07_26.tsv
    source: file                # file (path above, or SIGNOR API download when path is null) | omnipath (SIGNOR mirror; no SCORE/DIRECT columns)
    indirect: drop              # DIRECT=NO rows: drop (default) | weight (keep at 30 % weight) | keep
    # url: https://signor.uniroma2.it/getData.php?organism=9606     (used only when path is null and source is file)

  # ---- context layer: physical / pathway co-membership (not used for the walk by default) -----------------
  reactome_fi:
    path: ~/Documents/database/reactome/FIsInGene_061424_with_annotations.txt
    mode: context               # context (default: undirected context edges only) | directed (mechanistic FIs join the walk at `weight`) | off
    min_score: 1.0              # FI score threshold when mode=directed (1.0 = pathway-annotated; predicted FIs are always dropped)
    weight: 0.5                 # walk weight of Reactome-only directed edges when mode=directed (SIGNOR = 0.9)
  string:
    min_score: 700              # STRING physical network via API (experimental + database channels); annotation column physical_with_seed

  # ---- endpoints and annotations ----------------------------------------------------------------------------
  uniprot:
    path: ~/Documents/database/uniprot/uniprot_human_reviewed.tsv   # receptors (keyword Receptor + cell membrane) and compartments, offline
    # download once:
    # curl -o uniprot_human_reviewed.tsv "https://rest.uniprot.org/uniprotkb/stream?query=organism_id:9606+AND+reviewed:true&fields=accession,gene_primary,keyword,cc_subcellular_location&format=tsv"
  receptors:
    path: null                  # optional override: text file, one HGNC symbol per line (else derived from uniprot, else UniProt API)
  ligands:
    path: null                  # optional override of the secreted-ligand list (else derived from uniprot: Secreted + Cytokine/Growth factor/Hormone)
  compartments:
    path: null                  # optional override: tsv gene<TAB>compartment (membrane|cytosol|lysosome|mitochondrion|ER_golgi|nucleus)
  tf_list:
    path: ~/Documents/database/tf/DatabaseExtract_v_1.01.csv        # Lambert 2018; rows with "Is TF? = Yes" are the downstream endpoints
  regulon:
    source: dorothea            # dorothea | collectri (OmniPath dataset name)
    conf: ABC                   # DoRothEA confidence levels kept
    license: commercial         # OmniPath per-record licence filter: commercial | academic | ignore
    path: ~/Documents/database/dorothea/dorothea_ABC_commercial.tsv  # OmniPath export, or tf,target,mor,confidence; null = download
  omnipath:
    mode: full                  # full (default): every licence-filtered, signed OmniPath edge joins the walk graph (more interactions; the walk's
                                # min_score / hub_penalty keep hubs in check, the figures wrap crowded hops) | gaps: only where SIGNOR has no
                                # output from the source / no input to the target, plus edges touching the analysed genes | off
    signed_only: true           # drop directed-but-unsigned records (they add nodes without a sign)
    min_references: 1           # keep records with at least this many literature references
    datasets: omnipath,pathwayextra,kinaseextra,ligrecextra
    license: commercial         # keep a record only if a contributing resource is marked purpose=commercial by OmniPath (local filter)
    path: null                  # null = download once into cache_dir; or a saved OmniPath interactions tsv (genesymbols=1, fields=sources,references,...)
  custom_edges:
    path: null                  # optional tsv: src, dst, effect(+1/-1/0 or activate/inhibit) [, mechanism, residue, score, source]
                                # relations missing from SIGNOR (e.g. ACVRL1 -> SMAD1) or in-house data (AirID, phospho); merged as source 'custom', weight 0.8
  hpa_tissue:
    path: ~/Documents/database/hpa/rna_tissue_consensus_tissues.tsv  # columns Gene name, Tissue, nTPM; used only with --tissue NAME

  # ---- genetics -------------------------------------------------------------------------------------------
  depmap:
    dir: ~/Documents/database/depmap   # CRISPRGeneEffect.csv (+ OmicsSomaticMutations.csv, OmicsExpression*ProteinCoding*.csv); file names resolved automatically

# ---- walk parameters (upstream / downstream modes) --------------------------------------------------------
walk:
  max_depth: 5                  # hops from the seed
  min_score: 0.25               # drop nodes whose best-path score (edge weights x hub penalty) is below this; live AKT1: 0.2 -> 903 nodes/79 receptors, 0.3 -> 222/13
  hub_penalty: 0.25             # 0 = none, 0.5 = strong down-weighting of highly connected nodes
  seed_rescue: true             # seed with no edge in the walk direction (SIGNOR gap): add its own mechanistic Reactome FI edges so the walk can start
  seed_rescue_weight: 0.3       # low on purpose: a rescue edge onto a hub must not pull the hub's neighbourhood in (ACVRL1 -> PPP1CA case)

# ---- cross-talk mode: deliberately local walks (hubs reach most of the graph at depth 5) -------------------
crosstalk:
  max_depth: 3
  min_score: 0.3
  min_sign_confidence: 0.5      # endpoints count as synergistic/antagonistic only when both signs are at least this confident
  max_edges_plot: 40            # interference edges drawn in the figure (all are in interference.csv)

# ---- synthetic lethality (sl mode / research_gene) --------------------------------------------------------
sl:
  min_lost: 20                  # minimum cell lines with likely loss of the seed (else expression fallback, else skipped)
  padj: 0.05                    # BH-FDR threshold
  delta: 0.15                   # gene-effect difference threshold (seed-lost minus intact, must be below -delta)
